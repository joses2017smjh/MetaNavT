<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-label="Storage vs recall  ·  float32 / halfvec / binary+rescore">
  <rect width="860" height="420" fill="#121212"/>
  <rect x="12" y="12" width="836" height="396" rx="16" fill="#1A1A24" stroke="#2A2A38"/>
  <text x="32" y="44" fill="#F4F4F8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Storage vs recall  ·  float32 / halfvec / binary+rescore</text>
  <text x="32" y="64" fill="#A8B0C0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">halfvec is 2x smaller. Binary is ~32x smaller, then a float rescoring pass.</text>
  <rect x="210" y="72.0" width="610.0" height="90.7" rx="4" fill="#8EB4E8"/><text x="198" y="133.7" text-anchor="end" fill="#F4F4F8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">float32  (1024 B/vec)</text><text x="828.0" y="133.7" fill="#E8D6A0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">1.000</text><rect x="210" y="176.66666666666669" width="610.0" height="90.7" rx="4" fill="#E8D6A0"/><text x="198" y="238.3" text-anchor="end" fill="#F4F4F8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">halfvec  (512 B/vec)</text><text x="828.0" y="238.3" fill="#E8D6A0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">1.000</text><rect x="210" y="281.33333333333337" width="362.2" height="90.7" rx="4" fill="#FBDAEF"/><text x="198" y="343.0" text-anchor="end" fill="#F4F4F8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">binary+rescore  (32 B/vec)</text><text x="580.2" y="343.0" fill="#E8D6A0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">0.594</text>
</svg>
