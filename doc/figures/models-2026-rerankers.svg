  <text x="32" y="64" fill="#A8B0C0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">nDCG@10 with 95% bootstrap intervals over the queries (whiskers). The tag on a new model's row is its paired interval</text><text x="32" y="80" fill="#A8B0C0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">against the bge row it replaces: above or below zero, or a tie when it covers zero; every row is kept, losers included.</text><text x="32" y="96" fill="#A8B0C0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">The live demo serves bge-small and bge-reranker-v2-m3 on a CPU (marked served); the larger models are measured here for the benchmark tables, not served.</text>
