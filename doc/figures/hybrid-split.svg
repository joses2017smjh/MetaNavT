<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
  <rect width="860" height="300" fill="#121212"/>
  <rect x="12" y="12" width="836" height="276" rx="16" fill="#1A1A24" stroke="#2A2A38"/>
  <text x="32" y="44" fill="#F4F4F8" font-size="18" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">Same query  ·  two retrievers  ·  RRF</text>
  <text x="32" y="66" fill="#A8B0C0" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">“what does the fusion module do”  —  BM25 wants the filename. Dense wants the idea.</text>
  <rect x="32" y="84" width="380" height="180" rx="12" fill="#121212" stroke="#BABAE9"/>
  <text x="52" y="112" fill="#BABAE9" font-size="12" font-family="ui-monospace, monospace">BM25</text>
  <text x="52" y="140" fill="#F4F4F8" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">1  src/fusion.py</text>
  <text x="52" y="164" fill="#A8B0C0" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">token “fusion” in the path</text>
  <text x="52" y="196" fill="#A8B0C0" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">2  configs/run_047.yaml</text>
  <text x="52" y="220" fill="#A8B0C0" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">fusion: true</text>
  <rect x="448" y="84" width="380" height="180" rx="12" fill="#121212" stroke="#8EB4E8"/>
  <text x="468" y="112" fill="#8EB4E8" font-size="12" font-family="ui-monospace, monospace">dense</text>
  <text x="468" y="140" fill="#F4F4F8" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">1  configs where fusion is off</text>
  <text x="468" y="164" fill="#A8B0C0" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">paraphrase of “fusion was off”</text>
  <text x="468" y="196" fill="#E8D6A0" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">RRF keeps fusion.py at rank 1</text>
  <text x="468" y="220" fill="#A8B0C0" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">Recall@50  0.843 → 0.938</text>
</svg>
