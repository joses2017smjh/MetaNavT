# Override: real models on CPU (what the image ships; no CUDA wheels).
#   docker compose -f docker-compose.yml -f docker-compose.ml.yml up --build
# Installs the `ml` extra with CPU torch, embeds with BAAI/bge-small-en-v1.5
# (about 130 MB, 384 dims) and reranks the fused top 20 with
# BAAI/bge-reranker-v2-m3 (about 2.2 GB, fp32 on CPU, max_length 512). The
# pgvector table is created with EMBEDDING_DIM, so drop the volume when
# switching from the hash stack: docker compose down -v. The reranker is
# required: if it cannot load, /health is 503 and says why (no silent fallback).
# First start downloads about 2.5 GB (CPU torch wheels at build, then both
# models); the base docker-compose.yml downloads nothing.
services:
  api:
    build:
      args:
        EXTRAS: app,ml
        WITH_FRONTEND: "1"   # the Next.js export is built and served at / in this stack (manual CI job)
    environment:
      EMBEDDING_PROVIDER: huggingface
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_DIM: "384"
      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      RERANKER_PRECISION: fp32
      RERANKER_MAX_LENGTH: "512"
      RERANK_DEPTH: "20"
      RERANKER_REQUIRED: "true"
      BGE_ALLOW_DOWNLOAD: "1"
    healthcheck:
      start_period: 600s   # first start downloads the models and embeds the corpus on CPU
