[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metanavit"
version = "2.0.0"
description = "Hybrid BM25 + dense retrieval over research files: LLM-free benchmark, FastAPI API, MCP tools"
readme = "README.md"
requires-python = ">=3.11"
# Base: everything `make bench` and app/retrieval need. No LlamaIndex, no torch, no downloads.
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
# make test-eval / make bench on a clean clone (CI "eval" job).
eval = [
    "pytest>=8,<10",
    "pytest-mock>=3.12",
    "snowballstemmer>=2.2",  # Porter stemming for the BEIR-style BM25 analyzer (pure python)
    "httpx>=0.27",  # bounded load-runner tests; no live service required
    "cryptography>=42",  # Ed25519 operator capabilities (app/mcp/approvals.py); the eval tests sign and verify them
    "scikit-learn>=1.4",  # the TF-IDF embedder's rows in make bench-frontier (TfidfVectorizer + TruncatedSVD)
]
# Read-only mobile demo: actual BM25 + hash retrieval, no LlamaIndex/database/model extras.
mobile = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",  # fixture export exercises the shared HTTP response contract
]
# Read-only research companion and official MCP SDK for agent clients.
agent = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
]
# The FastAPI service and the Postgres/pgvector path (what the Docker image installs).
# HuggingFace embeddings live in `ml` because they pull torch; the image uses the
# hash-embedding adapter unless built with EXTRAS=app,ml.
app = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "rich>=13",
    "aiostream>=0.5",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    # 0.13 removed the legacy AgentRunner API that app/engine/agents still uses.
    "llama-index-core>=0.12.11,<0.13",
    "llama-index-vector-stores-postgres>=0.4",
    "llama-index-llms-ollama>=0.5",
    "llama-index-readers-file>=0.4",
    "mcp>=2,<3",  # official MCP SDK for app/mcp/server_sdk.py
    "cryptography>=42",  # Ed25519 operator capabilities; the plans router verifies them
]
# Real models on CPU or GPU: sentence-transformers embedders, the bge reranker,
# HuggingFace embeddings for LlamaIndex, and the demo/figure extras.
ml = [
    # <2.15: requirements/ml.txt pins torch's CPU wheel for the image, and docker-compose.gpu.yml installs the same
    # release from PyTorch's CUDA 12.6 wheel index, which has no 2.15 (checked 2026-11-11).
    "torch>=2.2,<2.15",
    "sentence-transformers>=3.0",
    "llama-index-embeddings-huggingface>=0.4",
    "scikit-learn>=1.4",
    "pillow>=10",
]
# The gradient-boosted distilled student of `make bench-rerank-arms` (app/retrieval/distill.py).
# Without it that arm is recorded as not evaluated; the least-squares student needs only numpy.
distill = [
    "lightgbm>=4.5,<5",
]
# Tooling only: `make lock` (pip-tools) and `make lint` (ruff). Never needed at run time.
dev = [
    "pip-tools>=7.4",
    "ruff>=0.6",
]
# Independent metric parity for external benchmark evidence (optional).
eval-trec = [
    "pytrec-eval-terrier>=0.5.10,<1",
]
# OpenTelemetry spans for the retrieval stages (app/observability.py); optional.
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.urls]
Repository = "https://github.com/joses2017smjh/MetaNavT"

[tool.setuptools.packages.find]
include = ["app*", "bench*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"app.mobile" = ["fixtures/*", "fixtures/**/*", "fixture-provenance.json"]

# `make lint` / the CI lint job. Deliberately narrow: every rule here flags a defect, not a
# style choice, so the gate can fail the build without blanket ignores.
#   E9   syntax and I/O errors (a module that does not parse)
#   F63  comparisons that are always true or false (`is` with a literal, assert on a tuple)
#   F7   statements that cannot run (return/yield/break outside their scope)
#   F82  undefined names, undefined __all__ entries, locals read before assignment
#   F811 a name (usually an import) redefined before it is used
#   F402 an import shadowed by a loop variable
# Not selected: F401 (unused imports). The tree has many, including files under the
# frozen bench/corpus fixture, so it could not be made green with real fixes.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811", "F402"]
