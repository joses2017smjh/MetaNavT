# docker compose up --build   -> Postgres + pgvector, then the API on :8000.
# The api container runs three steps in order, as CI's parity job does: the schema
# migrations, the index step (bench/corpus/files, 61 files, with the deterministic hash
# embedder, so no model download is needed and retrieval works without Ollama; later
# starts embed only changed files), then the server, which does not index itself.
# Only /api/chat needs an Ollama server (OLLAMA_BASE_URL).
#
# Nothing here is interpolated from .env on purpose: `cp .env.example .env` (the
# local-app setup) must not change what this stack runs. Real models:
#   docker compose -f docker-compose.yml -f docker-compose.ml.yml up --build
services:
  db:
    # pgvector only, without ParadeDB's pg_search (true BM25): lexical search is Postgres
    # ts_rank_cd, LEXICAL_BACKEND's default; /health reports bm25_backend.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metanavit
    ports:
      - "5432:5432"
    volumes:
      - metanavit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metanavit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        EXTRAS: app          # no torch; docker-compose.ml.yml sets app,ml
        WITH_FRONTEND: "0"   # API only; "1" builds the Next.js export
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_CONNECTION_STRING: postgresql://postgres:password@db:5432/metanavit
      PSYCOPG2_CONNECTION_STRING: dbname=metanavit user=postgres password=password host=db port=5432
      # chat only; retrieval never calls the LLM
      MODEL_PROVIDER: ollama
      MODEL: qwen2.5:14b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # retrieval: deterministic hash embedder, no reranker (both labelled in responses)
      EMBEDDING_PROVIDER: hash
      EMBEDDING_DIM: "256"
      RERANKER_MODEL: none
      RETRIEVAL_MODE: sql          # one SQL round trip (app/database/sql/); python = the reference path
      DATA_DIR: bench/corpus/files
      INDEX_ON_START: "false"      # the server does not index: the index step below does, before it starts
      INGEST_MAX_REJECTED: "0"     # a rejected file (undecodable, empty, too large, ...) fails the index step, which stops the container
      CHUNK_SIZE: "512"
      CHUNK_OVERLAP: "50"
      RETRIEVE_K: "50"
      RERANK_TOP_N: "8"
      ENABLE_ROUTER: "true"
      # observability (both optional): LOG_FORMAT=json for structured logs;
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces with --profile otel
      LOG_FORMAT: text
    # The deploy step first (schema migrations: tables, indexes, the vector extension; the
    # API runs no DDL; while one is pending it answers 503 and retries), then the index step
    # (python -m app.engine.ingest: diff DATA_DIR against the manifest, embed only what changed;
    # stopped after 900 s, and a failure stops the container), then the server.
    command: ["sh", "-c", "python -m app.database.migrate && timeout 900 python -m app.engine.ingest && exec uvicorn main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jaeger:
    # docker compose --profile otel up --build : Jaeger UI on :16686, OTLP/HTTP on :4318.
    # The API exports spans only when OTEL_EXPORTER_OTLP_ENDPOINT is set and the image
    # was built with EXTRAS=app,otel; otherwise spans are no-ops (/health.observability).
    image: jaegertracing/all-in-one:1.60
    profiles: ["otel"]
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  metanavit_pg:
