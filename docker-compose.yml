services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metanavit
    ports:
      - "5432:5432"
    volumes:
      - metanavit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metanavit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_CONNECTION_STRING: postgresql://postgres:password@db:5432/metanavit
      PSYCOPG2_CONNECTION_STRING: dbname=metanavit user=postgres password=password host=db port=5432
      MODEL_PROVIDER: ollama
      MODEL: qwen2.5:14b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATA_DIR: bench/corpus/files
      EMBEDDING_MODEL: BAAI/bge-large-en-v1.5
      EMBEDDING_DIM: 1024
      RETRIEVE_K: "50"
      RERANK_TOP_N: "8"
      ENABLE_ROUTER: "true"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  metanavit_pg:
