# docker compose up --build   -> Postgres + pgvector, then the API on :8000.
# First start indexes bench/corpus/files (61 files) with the deterministic hash
# embedder, so no model download is needed and retrieval works without Ollama.
# Only /api/chat needs an Ollama server (OLLAMA_BASE_URL).
#
# Real models: EXTRAS=app,ml EMBEDDING_PROVIDER=huggingface EMBEDDING_DIM=1024 \
#              RERANKER_MODEL=BAAI/bge-reranker-v2-m3 docker compose up --build
# (bge-large-en-v1.5 is a ~1.3 GB download; drop the volume to re-index with a new dim).
services:
  db:
    # pgvector only. ParadeDB's pg_search (true BM25) is not in this image, so lexical
    # search falls back to Postgres ts_rank_cd; /health reports bm25_backend.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metanavit
    ports:
      - "5432:5432"
    volumes:
      - metanavit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metanavit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        EXTRAS: ${EXTRAS:-app}
        WITH_FRONTEND: ${WITH_FRONTEND:-0}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_CONNECTION_STRING: postgresql://postgres:password@db:5432/metanavit
      PSYCOPG2_CONNECTION_STRING: dbname=metanavit user=postgres password=password host=db port=5432
      # chat only; retrieval never calls the LLM
      MODEL_PROVIDER: ollama
      MODEL: qwen2.5:14b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # retrieval
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-256}
      RERANKER_MODEL: ${RERANKER_MODEL:-none}
      DATA_DIR: bench/corpus/files
      INDEX_ON_START: "true"
      CHUNK_SIZE: "512"
      CHUNK_OVERLAP: "50"
      RETRIEVE_K: "50"
      RERANK_TOP_N: "8"
      ENABLE_ROUTER: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  metanavit_pg:
