[pytest]
# Bare `pytest` runs the LLM-free eval suite, which only needs `pip install -e ".[eval]"`.
# The unit / engine / API suites need the app extra: `make test-unit`. tests/database_tests
# and tests/benchmark_tests need a live Postgres / deepeval and are run on demand.
testpaths = tests/eval
norecursedirs = .vendor .git .frontend node_modules
