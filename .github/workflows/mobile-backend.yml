name: Mobile backend demo

on:
  push:
    branches: [main]
    paths: ["app/mobile/**", "app/api/routers/**", "tests/api/test_mobile_demo.py", "pyproject.toml", ".github/workflows/mobile-backend.yml"]
  pull_request:
    paths: ["app/mobile/**", "app/api/routers/**", "tests/api/test_mobile_demo.py", "pyproject.toml", ".github/workflows/mobile-backend.yml"]
  workflow_dispatch:

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[eval,mobile]"
      - run: python -m pytest tests/api/test_mobile_demo.py -q
      - run: python -m app.mobile.export --output /tmp/mobile-demo-response.json
      - uses: actions/upload-artifact@v4
        with:
          name: metanavt-mobile-fixture-response
          path: /tmp/mobile-demo-response.json
