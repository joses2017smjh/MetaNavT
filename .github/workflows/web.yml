name: Web client

# .frontend, the Next.js page the API serves at / (a static export): install it from its lockfile, run its tests
# (Node's test runner with jsdom: the plans panel, the chat and the API key field against a mocked API) and build
# the export, on every push to main and every pull request. The image's own frontend stage (WITH_FRONTEND=1) is
# built by ci.yml's docker-ml-smoke job only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: web client (npm ci, npm test, next build)
    # A named Ubuntu release, not ubuntu-latest, which moves to a new release on its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # One release (the one these steps were run with by hand), not a range.
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: .frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
