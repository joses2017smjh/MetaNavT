name: Infrastructure

# Terraform under infra/ (doc/deploy.md), checked offline with no AWS credentials: formatting, every root module
# initialised from its committed provider lock and validated, and tflint with the Terraform and AWS rules
# (infra/.tflint.hcl). Path-filtered, so it runs only when infra/ or the two workflows change and is never a required
# check (scripts/required_checks.py leaves path-filtered workflows out). Once the AWS account exists (the repository
# variables set), a pull request also gets a read-only plan of production from infra/bootstrap's plan role.

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # One release, not a range (>= 1.11: write-only arguments; the S3 backend's lockfile needs 1.10).
  TERRAFORM_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  CHECKPOINT_DISABLE: "1"

jobs:
  check:
    name: terraform fmt, validate, tflint (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff infra
      - name: terraform init -backend=false + validate, every root module (providers as their lock files pin them)
        run: |
          set -euo pipefail
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tf-plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for root in infra/bootstrap infra/envs/production infra/envs/staging; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
          # sha256 of tflint_linux_amd64.zip, from the v0.66.0 release's checksums.txt
          checksums: 22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e
          github_token: ${{ github.token }}
      - name: tflint, Terraform and AWS rules (the config by absolute path, or --recursive ignores it below infra/)
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init fetches the AWS ruleset from its GitHub release
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  plan:
    name: terraform plan, production (read-only; once the AWS account exists)
    if: ${{ github.event_name == 'pull_request' }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Repository variables (unset = no AWS account yet = no plan)
        id: variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$AWS_REGION" ] || [ -z "$AWS_PLAN_ROLE_ARN" ] || [ -z "$TF_STATE_BUCKET" ]; then
            echo "::notice title=Plan skipped::the repository variables AWS_REGION, AWS_PLAN_ROLE_ARN and TF_STATE_BUCKET are not set (doc/deploy.md): no plan"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.variables.outputs.enabled == 'true' }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: ${{ steps.variables.outputs.enabled == 'true' }}
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: ${{ steps.variables.outputs.enabled == 'true' }}
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: plan-${{ github.run_id }}
      - name: terraform plan (-lock=false; the last apply's image digest, so only the code's changes show)
        if: ${{ steps.variables.outputs.enabled == 'true' }}
        working-directory: infra/envs/production
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          set -euo pipefail
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
          # The state holds the task definitions as last applied, with that apply's digest; the deploys since then
          # registered their own revisions, which Terraform does not track. Passing the same digest back keeps those
          # task definitions out of the plan unless the code changed them.
          if ! digest=$(terraform output -raw image_digest 2>/dev/null); then
            echo "::notice title=Plan skipped::production has no state yet (not applied): nothing to plan against"
            exit 0
          fi
          export TF_VAR_image_digest="$digest"
          if [ -n "$ALERT_EMAIL" ]; then export TF_VAR_alert_email="$ALERT_EMAIL"; fi
          terraform plan -input=false -lock=false -no-color
