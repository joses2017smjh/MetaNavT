name: Agent Field mobile app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-app.yml", "app/agent/**", "app/mobile/**", "app/api/routers/retrieve.py", "requirements/agent.txt", "scripts/require_playwright_tests.py", "!mobile/demo/**", "!mobile/README.md", "!mobile/RESUME.md", "!mobile/THIRD_PARTY_NOTICES.md"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-app.yml", "app/agent/**", "app/mobile/**", "app/api/routers/retrieve.py", "requirements/agent.txt", "scripts/require_playwright_tests.py", "!mobile/demo/**", "!mobile/README.md", "!mobile/RESUME.md", "!mobile/THIRD_PARTY_NOTICES.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # connected.spec.ts's research-agent test talks to the real companion service over HTTP and
      # skips itself without AGENT_E2E_URL. The companion runs in demo mode (scripted decisions,
      # its real retrieval and inspection tools over the mobile fixture; no model, no key), started
      # as e2e/run-connected.py starts it. The soccer test in that file needs the Agentic-Soccer
      # repository's servers and still skips.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/agent.txt
      - name: Start the research companion (demo mode) for connected.spec.ts
        working-directory: .
        env:
          AGENT_ALLOWED_ORIGINS: http://127.0.0.1:8081,http://localhost:8081
        run: |
          python -m pip install -r requirements/agent.txt
          python -m pip install --no-deps -e .
          python -m pip check
          nohup python -m uvicorn app.agent.companion_api:app --host 127.0.0.1 --port 8002 > agent.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8002/agent/health | grep -q '"demo_ready":true'; then exit 0; fi
            sleep 1
          done
          echo "the companion did not become ready"; tail -n 50 agent.log; exit 1
      - name: Browser tests (connected.spec.ts asks the companion at AGENT_E2E_URL)
        env:
          AGENT_E2E_URL: http://127.0.0.1:8002
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/e2e-report.json
        run: npm run test:e2e -- --reporter=list,html,json
      # A skipped test leaves Playwright's exit code at 0: require the research-agent test to have
      # passed in every project, read from the JSON report (uploaded with test-results/).
      - name: connected.spec.ts ran (its research-agent test passed in every project, not skipped)
        run: python ../scripts/require_playwright_tests.py test-results/e2e-report.json --spec connected.spec.ts --title "actual research-agent demo service returns inspected citations through HTTP"
      - name: Companion log
        if: always()
        run: tail -n 60 ../agent.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-field-browser-tests
          path: |
            mobile/playwright-report/
            mobile/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: agent-field-web-preview
          path: mobile/dist/

  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # Google's repository no longer provides the obsolete `tools`
          # package that this action includes in its default package list.
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: mobile/android
      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-field-android-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt

  ios-simulator:
    needs: web
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build unsigned iOS simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Archive simulator app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app agent-field-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-field-ios-simulator
          path: mobile/agent-field-ios-simulator.zip
