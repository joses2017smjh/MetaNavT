name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # docker-ml-smoke once a week (owner decision OD18): Sundays 09:41 UTC, night in US Pacific
  # time and off the top of the hour, when GitHub delays scheduled runs most. GitHub runs a
  # schedule on the default branch only, and a scheduled run runs that job alone.
  schedule:
    - cron: "41 9 * * 0"
  workflow_dispatch:
    inputs:
      ml_smoke:
        description: "also run docker-ml-smoke: CPU latency of docker-compose.ml.yml (CPU torch + bge-small + bge-reranker) over the gold questions"
        type: boolean
        default: false

# Read-only token for every job; the two image jobs (image, image-ml) alone add packages: write, to push to ghcr.io.
permissions:
  contents: read

concurrency:
  # A scheduled run gets a group of its own: it runs on refs/heads/main like a push to main, and
  # in one group with cancel-in-progress a merge would cancel the weekly smoke, or the smoke a push run.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: true

jobs:
  lint:
    # ruff with the narrow rule set in pyproject.toml ([tool.ruff.lint]): syntax errors,
    # undefined names, shadowed and unused imports (unused imports are waived only under the
    # frozen bench/corpus fixture). Also checks that the pinned requirement files every
    # other job installs still cover pyproject.toml.
    name: lint (ruff) + lock check
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install (dev tools only, pinned)
        run: python -m pip install -r requirements/dev.txt
      - name: Lint
        run: make lint
      - name: Pinned files match pyproject.toml
        run: make lock-check

  eval:
    # Frozen fixture v1, hash embeddings, overlap reranker: no downloads, no database.
    name: eval (py${{ matrix.python }})
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: tests/eval read the harness module as committed at the commit a results file names
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/eval.txt
      - name: Install (eval extra only, pinned; then the package with no resolution)
        run: |
          python -m pip install -r requirements/eval.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Eval tests
        run: make test-eval
      - name: Verify real robotics snapshot and split integrity
        run: make robotics-verify
      - name: Bench
        run: make bench
      - name: Regression gate (nDCG@10 / Recall@10 / Recall@50 vs bench/results/main.json)
        run: make bench-gate
      - name: Exact reproduction (every field of every row equals bench/results/main.json; timings excepted)
        run: make bench-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-py${{ matrix.python }}
          path: bench/results/latest.json

  unit:
    # FastAPI + LlamaIndex stack installed, no Postgres: import-time side effects would fail here.
    name: unit + engine + api (app extra, no database)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (eval + app extras, pinned; then the package with no resolution)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Unit, engine and API contract tests
        run: make test-unit

  parity:
    # Postgres + pgvector service, the schema migrations, fixture v1 indexed by the index
    # step with the hash embedder (the same chunker as the bench, app/chunking through
    # app/eval/ingest.py), the API started in the background, then the 136 gold questions replayed through
    # POST /api/retrieve/ and scored like the bench. The live-database tests include
    # the exact check: the dense leg equals the in-memory dense search on every gold
    # question, on the planner's own plan and with the HNSW index forced, where the
    # served statement must still return RETRIEVE_K rows
    # (tests/database/test_dense_parity.py). The end-to-end nDCG@10 gap is
    # reported with its paired interval, not gated (the lexical legs differ by design);
    # the step fails only when the API is broken or bench/corpus/files differs from its
    # MANIFEST (app/eval/parity.py).
    name: parity (API over Postgres vs in-memory bench)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # the digest docker-compose.yml pins (pg16 = 0.8.7-pg16 on 2026-11-11); refresh it there, in docker-compose.prod.yml and here together
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: metanavit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d metanavit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_CONNECTION_STRING: postgresql://postgres:password@localhost:5432/metanavit
      PSYCOPG2_CONNECTION_STRING: dbname=metanavit user=postgres password=password host=localhost port=5432
      PG_TEST_DSN: postgresql://postgres:password@localhost:5432/metanavit
      MODEL_PROVIDER: ollama
      EMBEDDING_PROVIDER: hash
      EMBEDDING_DIM: "256"
      RERANKER_MODEL: none
      DATA_DIR: bench/corpus/files
      INDEX_ON_START: "false"    # the index step below indexes DATA_DIR; the API does not
      INGEST_MAX_REJECTED: "0"   # a fixture file that stops being indexable fails the index step
      RETRIEVE_K: "50"
      RERANK_TOP_N: "8"
      ENABLE_ROUTER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (eval + app extras, pinned; then the package with no resolution)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: SQL RRF == Python RRF, dense leg == in-memory dense search (also on a forced HNSW scan), incremental indexing, schema migrations, start-up checks (tests/database, live Postgres)
        run: python -m pytest tests/database -q -rs
      - name: Fixture mtimes from the MANIFEST (the served staleness filter reads disk mtimes; a checkout's are arbitrary)
        run: make fixture-mtimes
      - name: Schema migrations (the deploy step; while one is pending the API answers 503 and retries)
        run: make migrate
      - name: Index bench/corpus/files (the index step; a later run embeds only changed files)
        timeout-minutes: 10
        run: make index
      - name: Start the API (serves the indexed table; it does not index)
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          python scripts/smoke_retrieve.py --require-bm25
      - name: Parity eval (reports the nDCG@10 gap; fails on a broken API or a drifted fixture)
        run: make parity
      - name: API log
        if: always()
        run: tail -n 60 api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-results
          path: bench/results/parity_latest.json

  docker-smoke:
    # docker compose up --build, wait for /health (the api container migrates, then indexes
    # bench/corpus/files with the hash embedder, then starts the server), POST one query,
    # require hits with non-null paths. First, a check that docker-compose.prod.yml (the
    # production rehearsal) resolves with its template settings; that stack is not started in CI.
    name: docker compose smoke
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.prod.yml resolves (config only, from deploy/prod.env.example; not started)
        env:
          POSTGRES_PASSWORD: config-check-only   # the file requires one and the template leaves it empty; nothing starts
        run: |
          docker compose version
          docker compose -f docker-compose.prod.yml --env-file deploy/prod.env.example config --quiet
      - name: Reproduce the documented setup (.env must not change what the stack runs)
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 420
      - name: POST /api/retrieve/ (hits with paths; at least one lexical hit)
        run: python3 scripts/smoke_retrieve.py --require-bm25
      - name: API logs
        if: always()
        run: docker compose logs --no-color api | tail -n 150
      - name: Tear down
        if: always()
        run: docker compose down -v

  image:
    # The delivery stage: it starts only after every other job of this run passed, so an image is
    # published only for a commit whose lint, eval, unit, parity and Compose smoke all passed. It
    # builds the api image through docker-compose.yml (the build arguments docker-smoke uses), named
    # for ghcr.io and labelled with this repository and commit, starts the stack from that image, runs
    # the same retrieve smoke, and, on a push to main only, pushes the image it smoked as
    # ghcr.io/<owner>/<repo>:sha-<commit> and :main. A pull request or a manual run stops after the
    # smoke. The image's own command only serves: run the migrations and the index step first, as
    # docker-compose.yml's command does.
    name: image (build + smoke; push to ghcr.io on main)
    if: ${{ github.event_name != 'schedule' }}
    needs: [lint, eval, unit, parity, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Name and label the image (a Compose override; ghcr.io names are lowercase)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$image:sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=docker-compose.yml:$RUNNER_TEMP/image.yml" >> "$GITHUB_ENV"
          printf 'services:\n  api:\n    image: \"%s\"\n    pull_policy: build\n    build:\n      labels:\n        org.opencontainers.image.source: \"%s\"\n        org.opencontainers.image.revision: \"%s\"\n' \
            "$image:sha-$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/image.yml"
          cat "$RUNNER_TEMP/image.yml"
      - name: Build the api image and start the stack from it
        run: docker compose up --build -d --wait --wait-timeout 420
      - name: POST /api/retrieve/ against that image (hits with paths; at least one lexical hit)
        run: python3 scripts/smoke_retrieve.py --require-bm25
      - name: API logs
        if: always()
        run: docker compose logs --no-color api | tail -n 150
      - name: Tear down (the image stays)
        if: always()
        run: docker compose down -v
      - name: Log in to ghcr.io
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push the smoked image (sha-<commit>, then main)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push "$IMAGE_REF"
          docker tag "$IMAGE_REF" "$IMAGE:main"
          docker push "$IMAGE:main"
          echo "Pushed $IMAGE_REF and $IMAGE:main: $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF")" >> "$GITHUB_STEP_SUMMARY"

  image-ml:
    # The CPU model image: the api image as docker-compose.ml.yml builds it (EXTRAS=app,ml: torch's CPU
    # wheel and sentence-transformers from requirements/ml.txt; the Next.js export), the image
    # docker-compose.prod.yml runs. It starts after the image job, so only for a commit whose every
    # other job passed, and never on a pull request: it downloads about 2.5 GB (CPU torch at build;
    # bge-small and bge-reranker-v2-m3 at the first start, into the container, not into the image) and
    # embeds the corpus on CPU, about ten minutes, so it is not a required check
    # (scripts/required_checks.py). Like the image job it names and labels the image, builds it through
    # Compose and starts the stack from it; the retrieve smoke here also requires the reranker, then the
    # app's entry points are imported inside the running container. On a push to main only, it pushes
    # the image it smoked as ghcr.io/<owner>/<repo>:sha-<commit>-ml and :main-ml; a manual run stops
    # before the push. A scheduled run skips it (the image job it needs is skipped there).
    name: image ml (CPU models; build + smoke; push to ghcr.io on main)
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Name and label the image (a Compose override over docker-compose.ml.yml; ghcr.io names are lowercase)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$image:sha-$GITHUB_SHA-ml" >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ml.yml:$RUNNER_TEMP/image.yml" >> "$GITHUB_ENV"
          printf 'services:\n  api:\n    image: \"%s\"\n    pull_policy: build\n    build:\n      labels:\n        org.opencontainers.image.source: \"%s\"\n        org.opencontainers.image.revision: \"%s\"\n' \
            "$image:sha-$GITHUB_SHA-ml" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/image.yml"
          cat "$RUNNER_TEMP/image.yml"
      - name: Build the CPU model image and start the stack from it (the first start downloads both models)
        run: docker compose up --build -d --wait --wait-timeout 1800
      - name: POST /api/retrieve/ against that image (hits with paths; a lexical hit; reranker loaded, nothing degraded)
        run: python3 scripts/smoke_retrieve.py --require-bm25 --require-reranker
      - name: The app's entry points import inside that container (served app, public demo, deploy steps, ml extra on CPU, answer clients)
        # main imports every router of the full API (this stack leaves PUBLIC_DEMO off); app.api.public is
        # the public demo's surface, with the answer route, app/answer/claude.py and app/api/limits.py;
        # migrate and ingest are the deploy and index steps; the reranker, the HuggingFace embedder and
        # torch (the CPU build) come from the ml extra. anthropic and redis (pinned in requirements/app.txt)
        # are imported only inside the answer path's functions, so they are named here.
        run: |
          docker compose exec -T api python -c "import main, app.api.public, app.api.routers.answer, app.answer.claude, app.api.limits, app.database.migrate, app.engine.ingest, app.retrieval.rerank, llama_index.embeddings.huggingface, sentence_transformers, torch, anthropic, redis; assert torch.version.cuda is None; print('imports OK; torch', torch.__version__)"
      - name: API logs
        if: always()
        run: docker compose logs --no-color api | tail -n 150
      - name: Tear down (the image stays)
        if: always()
        run: docker compose down -v
      - name: Log in to ghcr.io
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push the smoked image (sha-<commit>-ml, then main-ml)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push "$IMAGE_REF"
          docker tag "$IMAGE_REF" "$IMAGE:main-ml"
          docker push "$IMAGE:main-ml"
          echo "Pushed $IMAGE_REF and $IMAGE:main-ml: $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF")" >> "$GITHUB_STEP_SUMMARY"

  docker-ml-smoke:
    # Weekly (the schedule above) and on a manual run with ml_smoke: builds the CPU real-model
    # stack from the pinned files (requirements/ml.txt, torch's CPU wheel; the Next.js export
    # too), confirms the reranker loads on CPU (/health.reranker.loaded, no degraded components)
    # and records per-query latency over the 136 gold questions as an artifact. image-ml builds
    # and smokes the same stack on every push to main and every manual run; this job adds the
    # latency record, and the weekly run catches drift in a week with no push (the models are
    # downloaded at each first start).
    # docker-compose.gpu.yml has no job: hosted runners have no GPU, so it is built by hand only.
    name: docker compose ml smoke (CPU, weekly + manual)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ml_smoke) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the CPU real-model stack
        run: docker compose -f docker-compose.yml -f docker-compose.ml.yml up --build -d --wait --wait-timeout 1800
      - name: Reranker loaded, no degraded components, latency over the gold set
        run: python3 scripts/smoke_retrieve.py --require-bm25 --require-reranker --latency bench/gold/questions.jsonl --latency-out bench/results/api_latency_docker_cpu_ml.json
      - name: API log
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ml.yml logs --no-color api | tail -n 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-latency-docker-cpu-ml
          path: bench/results/api_latency_docker_cpu_ml.json
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ml.yml down -v
