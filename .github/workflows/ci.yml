name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # docker-ml-smoke once a week (owner decision OD18): Sundays 09:41 UTC, night in US Pacific
  # time and off the top of the hour, when GitHub delays scheduled runs most. GitHub runs a
  # schedule on the default branch only, and a scheduled run runs that job alone.
  schedule:
    - cron: "41 9 * * 0"
  workflow_dispatch:
    inputs:
      ml_smoke:
        description: "also build docker-compose.ml.yml (CPU torch + bge-small + bge-reranker) and measure CPU latency"
        type: boolean
        default: false

concurrency:
  # A scheduled run gets a group of its own: it runs on refs/heads/main like a push to main, and
  # in one group with cancel-in-progress a merge would cancel the weekly smoke, or the smoke a push run.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: true

jobs:
  lint:
    # ruff with the narrow defect-only rule set in pyproject.toml ([tool.ruff.lint]):
    # syntax errors, undefined names, shadowed imports. Also checks that the pinned
    # requirement files every other job installs still cover pyproject.toml.
    name: lint (ruff) + lock check
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install (dev tools only, pinned)
        run: python -m pip install -r requirements/dev.txt
      - name: Lint
        run: make lint
      - name: Pinned files match pyproject.toml
        run: make lock-check

  eval:
    # Frozen fixture v1, hash embeddings, overlap reranker: no downloads, no database.
    name: eval (py${{ matrix.python }})
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/eval.txt
      - name: Install (eval extra only, pinned; then the package with no resolution)
        run: |
          python -m pip install -r requirements/eval.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Eval tests
        run: make test-eval
      - name: Verify real robotics snapshot and split integrity
        run: make robotics-verify
      - name: Bench
        run: make bench
      - name: Regression gate (nDCG@10 / Recall@10 / Recall@50 vs bench/results/main.json)
        run: make bench-gate
      - name: Exact reproduction (every field of every row equals bench/results/main.json; timings excepted)
        run: make bench-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-py${{ matrix.python }}
          path: bench/results/latest.json

  unit:
    # FastAPI + LlamaIndex stack installed, no Postgres: import-time side effects would fail here.
    name: unit + engine + api (app extra, no database)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (eval + app extras, pinned; then the package with no resolution)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Unit, engine and API contract tests
        run: make test-unit

  parity:
    # Postgres + pgvector service, the schema migrations, fixture v1 indexed by the index
    # step with the hash embedder (the same chunker as the bench, app/chunking through
    # app/eval/ingest.py), the API started in the background, then the 136 gold questions replayed through
    # POST /api/retrieve/ and scored like the bench. The live-database tests include
    # the exact check: the dense leg equals the in-memory dense search on every gold
    # question, on the planner's own plan and with the HNSW index forced, where the
    # served statement must still return RETRIEVE_K rows
    # (tests/database/test_dense_parity.py). The end-to-end nDCG@10 gap is
    # reported with its paired interval, not gated (the lexical legs differ by design);
    # the step fails only when the API is broken or bench/corpus/files differs from its
    # MANIFEST (app/eval/parity.py).
    name: parity (API over Postgres vs in-memory bench)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # the digest docker-compose.yml pins (pg16 = 0.8.7-pg16 on 2026-11-11); refresh both together
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: metanavit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d metanavit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_CONNECTION_STRING: postgresql://postgres:password@localhost:5432/metanavit
      PSYCOPG2_CONNECTION_STRING: dbname=metanavit user=postgres password=password host=localhost port=5432
      PG_TEST_DSN: postgresql://postgres:password@localhost:5432/metanavit
      MODEL_PROVIDER: ollama
      EMBEDDING_PROVIDER: hash
      EMBEDDING_DIM: "256"
      RERANKER_MODEL: none
      DATA_DIR: bench/corpus/files
      INDEX_ON_START: "false"    # the index step below indexes DATA_DIR; the API does not
      INGEST_MAX_REJECTED: "0"   # a fixture file that stops being indexable fails the index step
      RETRIEVE_K: "50"
      RERANK_TOP_N: "8"
      ENABLE_ROUTER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (eval + app extras, pinned; then the package with no resolution)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: SQL RRF == Python RRF, dense leg == in-memory dense search (also on a forced HNSW scan), incremental indexing, schema migrations, start-up checks (tests/database, live Postgres)
        run: python -m pytest tests/database -q -rs
      - name: Fixture mtimes from the MANIFEST (the served staleness filter reads disk mtimes; a checkout's are arbitrary)
        run: make fixture-mtimes
      - name: Schema migrations (the deploy step; while one is pending the API answers 503 and retries)
        run: make migrate
      - name: Index bench/corpus/files (the index step; a later run embeds only changed files)
        timeout-minutes: 10
        run: make index
      - name: Start the API (serves the indexed table; it does not index)
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          python scripts/smoke_retrieve.py --require-bm25
      - name: Parity eval (reports the nDCG@10 gap; fails on a broken API or a drifted fixture)
        run: make parity
      - name: API log
        if: always()
        run: tail -n 60 api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-results
          path: bench/results/parity.json

  docker-smoke:
    # docker compose up --build, wait for /health (the api container migrates, then indexes
    # bench/corpus/files with the hash embedder, then starts the server), POST one query,
    # require hits with non-null paths.
    name: docker compose smoke
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the documented setup (.env must not change what the stack runs)
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 420
      - name: POST /api/retrieve/ (hits with paths; at least one lexical hit)
        run: python3 scripts/smoke_retrieve.py --require-bm25
      - name: API logs
        if: always()
        run: docker compose logs --no-color api | tail -n 150
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-ml-smoke:
    # Weekly (the schedule above) and on a manual run with ml_smoke: builds the CPU real-model
    # stack from the pinned files (requirements/ml.txt, torch's CPU wheel; the Next.js export
    # too), confirms the reranker loads on CPU (/health.reranker.loaded, no degraded components)
    # and records per-query latency over the 136 gold questions as an artifact. Not part of
    # every push: it downloads about 2.5 GB (CPU torch, bge-small, bge-reranker-v2-m3).
    # docker-compose.gpu.yml has no job: hosted runners have no GPU, so it is built by hand only.
    name: docker compose ml smoke (CPU, weekly + manual)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ml_smoke) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the CPU real-model stack
        run: docker compose -f docker-compose.yml -f docker-compose.ml.yml up --build -d --wait --wait-timeout 1800
      - name: Reranker loaded, no degraded components, latency over the gold set
        run: python3 scripts/smoke_retrieve.py --require-bm25 --require-reranker --latency bench/gold/questions.jsonl --latency-out bench/results/api_latency_docker_cpu_ml.json
      - name: API log
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ml.yml logs --no-color api | tail -n 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-latency-docker-cpu-ml
          path: bench/results/api_latency_docker_cpu_ml.json
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ml.yml down -v
